name: Create Galaxy Gold Questions

on:
  workflow_dispatch:

permissions:
  contents: read
  discussions: write

jobs:
  create:
    name: Create gold Q&A discussions
    runs-on: ubuntu-latest

    steps:
      - name: Create discussions
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const name = context.repo.repo;

            const data = await github.graphql(`
              query($owner: String!, $name: String!) {
                repository(owner: $owner, name: $name) {
                  id
                  discussionCategories(first: 20) {
                    nodes {
                      id
                      isAnswerable
                    }
                  }
                }
              }
            `, { owner, name });

            const category = data.repository.discussionCategories.nodes.find((item) => item.isAnswerable);
            if (!category) {
              throw new Error("No answerable discussion category found.");
            }

            const questions = [
              ["How should PaceUP choose the next workout card?", "The start dashboard can show many possible actions. Which rule should decide the next workout card?"],
              ["How should PaceUP handle paused activity tracking?", "When GPS tracking is added, how should paused time affect pace, duration, and XP?"],
              ["What should PaceUP do when a quest expires?", "If a daily or weekly quest expires before completion, how should the app present the result?"],
              ["How should PaceUP compare weekly progress?", "Which comparison should be preferred when showing weekly progress to a user?"],
              ["What should PaceUP show after a badge unlock?", "After a badge unlock, what feedback should appear without blocking the user flow?"],
              ["How should PaceUP handle missing profile photos?", "What should the UI show when a user has not uploaded a profile photo?"],
              ["What should PaceUP do when plan progress is behind?", "How should the product encourage the user when they miss planned workouts?"],
              ["How should PaceUP summarize a walking activity?", "Which metrics should a walking summary prioritize for low-pressure progress?"],
              ["How should PaceUP handle cycling pace language?", "Why should cycling use speed-oriented language instead of running pace?"],
              ["What should PaceUP display for a team with no recent activity?", "How should an inactive team screen remain useful and positive?"],
              ["How should PaceUP treat social activities in XP?", "Should social activities earn XP, and how should that reward be balanced?"],
              ["What should PaceUP do when event capacity is full?", "How should the UI explain a full event and guide the user toward alternatives?"],
              ["How should PaceUP handle duplicate team joins?", "If a join request is retried, how should the app avoid duplicated membership state?"],
              ["What should PaceUP show during a slow save?", "When an activity save is slow, what loading state should be visible?"],
              ["How should PaceUP handle offline activity completion?", "If the user finishes an activity offline, what should happen to history and XP?"],
              ["What should PaceUP include in a public profile preview?", "Which data is safe for a public profile preview by default?"],
              ["How should PaceUP present RPE in strength workouts?", "How should optional RPE be explained without making logging slower?"],
              ["What should PaceUP do when notification permission is denied?", "How should the app continue to work when notification permission is unavailable?"],
              ["How should PaceUP handle deleted activities?", "If an activity is deleted, what should happen to XP, quests, and analytics?"],
              ["What should PaceUP show before joining a race-prep group?", "Which information helps a user decide whether to join a race-prep group?"],
              ["How should PaceUP organize settings?", "Which settings groups should be easiest to find?"],
              ["How should PaceUP explain mock mode to contributors?", "How should contributors understand whether data is local mock state or database-backed state?"]
            ];

            for (const [title, body] of questions) {
              await github.graphql(`
                mutation($repositoryId: ID!, $categoryId: ID!, $title: String!, $body: String!) {
                  createDiscussion(input: {
                    repositoryId: $repositoryId,
                    categoryId: $categoryId,
                    title: $title,
                    body: $body
                  }) {
                    discussion {
                      number
                      url
                    }
                  }
                }
              `, {
                repositoryId: data.repository.id,
                categoryId: category.id,
                title,
                body
              });
            }
