name: Mark All Galaxy Answers

on:
  workflow_dispatch:

permissions:
  contents: read
  discussions: write

jobs:
  mark:
    name: Mark all unanswered bot questions
    runs-on: ubuntu-latest

    steps:
      - name: Mark accepted answers
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const name = context.repo.repo;

            const data = await github.graphql(`
              query($owner: String!, $name: String!) {
                repository(owner: $owner, name: $name) {
                  discussions(first: 60, orderBy: { field: CREATED_AT, direction: DESC }) {
                    nodes {
                      number
                      author {
                        login
                      }
                      answer {
                        id
                      }
                      comments(first: 10) {
                        nodes {
                          id
                          author {
                            login
                          }
                        }
                      }
                    }
                  }
                }
              }
            `, { owner, name });

            let marked = 0;
            for (const discussion of data.repository.discussions.nodes) {
              if (discussion.author?.login !== "github-actions") continue;
              if (discussion.answer) continue;

              const comment = discussion.comments.nodes.find((item) => item.author?.login === owner);
              if (!comment) continue;

              await github.graphql(`
                mutation($id: ID!) {
                  markDiscussionCommentAsAnswer(input: { id: $id }) {
                    discussion {
                      number
                    }
                  }
                }
              `, { id: comment.id });
              marked += 1;
            }

            core.info(`Marked ${marked} accepted answers.`);
