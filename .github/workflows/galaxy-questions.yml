name: Create Galaxy Questions

on:
  workflow_dispatch:

permissions:
  contents: read
  discussions: write

jobs:
  create:
    name: Create Q&A discussions
    runs-on: ubuntu-latest

    steps:
      - name: Create discussions
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const name = context.repo.repo;

            const data = await github.graphql(`
              query($owner: String!, $name: String!) {
                repository(owner: $owner, name: $name) {
                  id
                  discussionCategories(first: 20) {
                    nodes {
                      id
                      name
                      isAnswerable
                    }
                  }
                }
              }
            `, { owner, name });

            const category = data.repository.discussionCategories.nodes.find((item) => item.isAnswerable);
            if (!category) {
              throw new Error("No answerable discussion category found.");
            }

            const questions = [
              {
                title: "What should PaceUP show when a new user has no activity history?",
                body: "PaceUP starts with empty history for every new user. What should the product show so the screen feels useful instead of unfinished?"
              },
              {
                title: "How should PaceUP handle private activity data in teams?",
                body: "PaceUP teams should encourage shared progress, but activity data can be sensitive. What information should team views show by default?"
              }
            ];

            for (const question of questions) {
              await github.graphql(`
                mutation($repositoryId: ID!, $categoryId: ID!, $title: String!, $body: String!) {
                  createDiscussion(input: {
                    repositoryId: $repositoryId,
                    categoryId: $categoryId,
                    title: $title,
                    body: $body
                  }) {
                    discussion {
                      number
                      url
                    }
                  }
                }
              `, {
                repositoryId: data.repository.id,
                categoryId: category.id,
                title: question.title,
                body: question.body
              });
            }
