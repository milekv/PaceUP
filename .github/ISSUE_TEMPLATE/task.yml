name: Task
description: Track implementation, cleanup, or documentation work.
title: "chore: "
labels: ["task"]
body:
  - type: textarea
    id: task
    attributes:
      label: Task
      description: What needs to be done?
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Definition of done
      placeholder: |
        - [ ] Code updated
        - [ ] Docs updated
        - [ ] Checks pass
